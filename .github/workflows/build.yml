name: Fetch YouTube Shorts (No API Key)

on:
  push:
    branches:
      - main
  schedule:
    # Daily auto-run at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual button on GitHub Actions page

jobs:
  build-and-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run Fetching Script
        run: python fetch_shorts.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json" && git push)
